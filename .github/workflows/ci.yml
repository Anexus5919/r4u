name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# least privilege, stated explicitly: gitleaks reads the pull request's commits, nothing writes
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # runs first: it is the cheapest check and the one most likely to catch drift
      - name: Design guard
        run: bash scripts/design-guard.sh

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first use; cache it across runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # the dev server imports @r4u/shared from its built dist, which a clean checkout lacks
      - name: Build shared
        run: npm run build --workspace=shared

      - name: Server env
        run: |
          {
            echo "NODE_ENV=development"
            echo "MONGODB_URI=mongodb://127.0.0.1:27017/unused"
            echo "JWT_ACCESS_SECRET=ci-access-secret-that-is-long-enough-0000000"
            echo "JWT_REFRESH_SECRET=ci-refresh-secret-that-is-long-enough-000000"
            echo "CORS_ORIGINS=http://localhost:5173"
            echo "APP_URL=http://localhost:5173"
            echo "LOG_LEVEL=warn"
          } > server/.env

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v5

      - name: Build server image
        run: docker build -f server/Dockerfile -t r4u-server .

      - name: Build client image
        run: docker build -f client/Dockerfile -t r4u-client .

      # the image must boot and report a connected database, not just compile
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/api/health | grep -q '"db":1'; then echo healthy; break; fi
            sleep 3
          done
          curl -fs http://localhost:8080/api/health | grep -q '"db":1'
          docker compose down -v

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify, test, e2e, docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # each target deploys only when its secrets exist, so a fork without them still goes green
      - name: Deploy the API to Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - uses: actions/setup-node@v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22

      - name: Deploy the client to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: client
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
