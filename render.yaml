# Render blueprint for the API. New, Blueprint, then point it at this repository.
# Free web service: spins down after 15 minutes idle. Never add a keep-alive cron (see COST.md).
services:
  - type: web
    name: r4u-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # redeploy on a push to main only after every GitHub Actions check on that commit has passed
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      # the Vercel production URL, comma separated if there are more
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOW_PREVIEW_ORIGINS
        value: 'false'
      - key: LOG_LEVEL
        value: info
      - key: SEED_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Brevo sends over HTTPS; the free plan blocks SMTP ports, so this is how reset mail leaves
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
