# The whole stack from a clean clone: docker compose up --build, then http://localhost:8080
# The defaults below are for a local machine only. Set real values in a .env file next to this one.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/r4u
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-only-access-secret-change-me-000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-only-refresh-secret-change-me-00000}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_LEVEL: info
      SEED_PASSWORD: ${SEED_PASSWORD:-R4uDemo-2026!}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-R4U <no-reply@r4u.local>}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: server:5000
    ports:
      - '8080:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
